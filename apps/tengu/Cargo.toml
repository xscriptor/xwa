[package]
name = "tengu"
version = "0.1.0"
edition = "2021"
description = "Web quality auditor -- Performance, SEO, Accessibility, Best Practices"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["cors"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "cookies", "gzip", "brotli", "json"] }
scraper = "0.21"
selectors = "0.26"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
tokio-stream = "0.1"
dashmap = "6"
regex = "1"
sha2 = "0.10"
base64 = "0.22"
thiserror = "2"
ego-tree = "0.9"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono"], optional = true }

[features]
default = []
pg = ["sqlx"]
