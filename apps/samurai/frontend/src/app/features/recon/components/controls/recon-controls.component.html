<div class="recon-panel">
  <div class="control-group">
    <label class="t-label" for="recon-target-domain">{{ 'TARGET DOMAIN' | t }}</label>
    <input
      id="recon-target-domain"
      name="recon-target-domain"
      type="text"
      [ngModel]="targetDomain"
      (ngModelChange)="onInput($event)"
      (keyup.enter)="start.emit()"
      placeholder="{{ 'example.com or https://example.com' | t }}"
      class="input-field"
      [disabled]="isScanning"
      aria-label="Target domain"
    />
  </div>

  <div class="control-group">
    <label class="t-label">{{ 'RECON MODULES' | t }}</label>
    <div class="modules-grid">
      <button
        *ngFor="let module of reconModules"
        type="button"
        (click)="toggleModule.emit(module.id)"
        [class.selected]="selectedModules.includes(module.id)"
        [disabled]="isScanning"
        class="module-btn"
        [title]="module.description"
        [attr.aria-label]="'Toggle module ' + module.label | t"
        [attr.aria-pressed]="selectedModules.includes(module.id)"
      >
        <span class="module-icon">{{ module.icon }}</span>
        <span class="module-name">{{ module.label }}</span>
      </button>
    </div>
  </div>

  <div class="quick-select">
    <span class="t-label">{{ 'QUICK PRESETS:' | t }}</span>
    <button type="button" (click)="preset.emit('all')" [disabled]="isScanning" class="preset-btn" [attr.aria-label]="'Select all reconnaissance modules' | t">{{ 'All Modules' | t }}</button>
    <button type="button" (click)="preset.emit('basic')" [disabled]="isScanning" class="preset-btn" [attr.aria-label]="'Select basic modules DNS and headers' | t">{{ 'Basic (DNS + Headers)' | t }}</button>
    <button type="button" (click)="preset.emit('api')" [disabled]="isScanning" class="preset-btn" [attr.aria-label]="'Select API-focused modules' | t">{{ 'API Focus' | t }}</button>
  </div>

  <div class="action-group">
    <button type="button" (click)="start.emit()" [disabled]="!targetDomain || isScanning" class="btn btn-primary" [attr.aria-label]="'Start reconnaissance scan' | t">
      {{ isScanning ? ('SCANNING...' | t) : ('START RECONNAISSANCE' | t) }}
    </button>
    <button type="button" (click)="clear.emit()" [disabled]="isScanning" class="btn btn-secondary" [attr.aria-label]="'Clear terminal output' | t">{{ 'CLEAR TERMINAL' | t }}</button>
  </div>
</div>
